lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@scope/pkg':
        specifier: ^2.1.0
        version: 2.1.0
      lodash:
        specifier: ^4.17.21
        version: 4.17.21
    devDependencies:
      typescript:
        specifier: ^5.4.0
        version: 5.4.5

packages:

  '@scope/pkg@2.1.0':
    resolution: {integrity: sha512-abc}

  lodash@4.17.21:
    resolution: {integrity: sha512-def}

  ms@2.1.3:
    resolution: {integrity: sha512-ghi}

  typescript@5.4.5:
    resolution: {integrity: sha512-jkl}
    engines: {node: '>=14.17'}
    hasBin: true

snapshots:

  '@scope/pkg@2.1.0':
    dependencies:
      ms: 2.1.3

  lodash@4.17.21: {}

  ms@2.1.3: {}

  typescript@5.4.5: {}
